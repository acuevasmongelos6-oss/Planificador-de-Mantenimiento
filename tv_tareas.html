<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento Frigomerc — Pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #080b10;
  --bg2:       #0d1117;
  --bg3:       #131920;
  --border:    #1e2a38;
  --border2:   #243040;
  --text:      #d4dde8;
  --text2:     #6b7d8f;
  --text3:     #3a4a5a;
  --accent:    #1a7fff;
  --urg:       #e04040;
  --norm:      #d4920a;
  --baja:      #1e8a4a;
  --dias-ok:   #1e8a4a;
  --dias-warn: #c47a0a;
  --dias-crit: #c83030;
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'IBM Plex Sans', sans-serif;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
}

/* ── SCANLINES overlay ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.06) 3px,
    rgba(0,0,0,.06) 4px
  );
  pointer-events: none;
  z-index: 999;
}

/* ── HEADER ── */
.header {
  height: 72px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 0;
  position: relative;
}

.header-logo {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.header-logo-top {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--accent);
}

.header-logo-bot {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text);
}

.header-stats {
  display: flex;
  gap: 32px;
  align-items: center;
  flex: 1;
  justify-content: center;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.stat-val {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 700;
  line-height: 1;
}

.stat-label {
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text2);
}

.header-clock {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.clock-time {
  font-family: var(--mono);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: .05em;
  color: var(--text);
}

.clock-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* ── REFRESH BAR ── */
.refresh-bar {
  height: 2px;
  background: var(--border);
  position: relative;
  overflow: hidden;
}

.refresh-progress {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: none;
}

/* ── LEGEND ── */
.legend {
  height: 32px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 28px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-family: var(--mono);
  letter-spacing: .08em;
  color: var(--text2);
  text-transform: uppercase;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.legend-sep {
  width: 1px;
  height: 16px;
  background: var(--border2);
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 8px;
  padding: 8px;
  height: calc(100vh - 72px - 2px - 32px);
}

/* ── CARD ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  transition: border-color .3s;
}

.card.has-urgent { border-color: rgba(224,64,64,.4); }

.card-header {
  padding: 6px 10px 5px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-shrink: 0;
}

.card-nombre {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-legajo {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: .08em;
  flex-shrink: 0;
  margin-left: 6px;
}

.card-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text2);
  flex-shrink: 0;
  margin-left: 6px;
}

.card-body {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.card-scroll {
  padding: 5px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.empty-state {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  letter-spacing: .1em;
}

/* ── TASK ROW ── */
.task {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 4px 7px;
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 32px;
}

.task.prio-urg { border-left: 2px solid var(--urg); }
.task.prio-norm { border-left: 2px solid var(--norm); }
.task.prio-baja { border-left: 2px solid var(--baja); }

.task-info { flex: 1; min-width: 0; }

.task-desc {
  font-size: 10px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.task-sector {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.badges { display: flex; gap: 3px; flex-shrink: 0; }

.badge {
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  padding: 2px 4px;
  border-radius: 3px;
  letter-spacing: .04em;
  white-space: nowrap;
}

.badge-urg  { background: rgba(224,64,64,.2);  color: #ff7070; border: 1px solid rgba(224,64,64,.3); }
.badge-norm { background: rgba(212,146,10,.15); color: #e8b050; border: 1px solid rgba(212,146,10,.25); }
.badge-baja { background: rgba(30,138,74,.15);  color: #5ec87a; border: 1px solid rgba(30,138,74,.25); }
.badge-ok   { background: rgba(30,138,74,.15);  color: #5ec87a; border: 1px solid rgba(30,138,74,.25); }
.badge-warn { background: rgba(196,122,10,.15); color: #e8a040; border: 1px solid rgba(196,122,10,.25); }
.badge-crit { background: rgba(200,48,48,.2);   color: #ff6060; border: 1px solid rgba(200,48,48,.3); }

/* ── LOADING ── */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 16px;
  z-index: 100;
  font-family: var(--mono);
  font-size: 13px;
  color: var(--text2);
  letter-spacing: .1em;
}

.spinner-tv {
  width: 32px; height: 32px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── PULSE ANIM FOR URGENT ── */
@keyframes pulse-border {
  0%, 100% { border-color: rgba(224,64,64,.4); }
  50%       { border-color: rgba(224,64,64,.8); }
}
.card.has-urgent { animation: pulse-border 2s ease infinite; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner-tv"></div>
  CARGANDO DATOS...
</div>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">
    <div class="header-logo-top">● Sistema de Mantenimiento</div>
    <div class="header-logo-bot">Frigomerc — Pendientes</div>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-val" id="stat-total" style="color:var(--accent)">—</div>
      <div class="stat-label">Tareas asignadas</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border2)"></div>
    <div class="stat">
      <div class="stat-val" id="stat-urg" style="color:var(--urg)">—</div>
      <div class="stat-label">Urgentes</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border2)"></div>
    <div class="stat">
      <div class="stat-val" id="stat-crit" style="color:var(--dias-crit)">—</div>
      <div class="stat-label">Críticas +7d</div>
    </div>
  </div>
  <div class="header-clock">
    <div class="clock-time" id="clock-time">--:--:--</div>
    <div class="clock-date" id="clock-date">---</div>
  </div>
</div>

<!-- REFRESH BAR -->
<div class="refresh-bar">
  <div class="refresh-progress" id="refresh-progress"></div>
</div>

<!-- LEGEND -->
<div class="legend">
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--urg)"></div>
    Urgente
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--norm)"></div>
    Normal
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--baja)"></div>
    Baja
  </div>
  <div class="legend-sep"></div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--dias-ok)"></div>
    1–3 días
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--dias-warn)"></div>
    4–7 días
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--dias-crit)"></div>
    +7 días
  </div>
  <div class="legend-sep"></div>
  <div class="legend-item" style="color:var(--text3)">
    ↻ Auto-actualización cada 30s
  </div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<script>
const URL_PLAN = 'https://script.google.com/macros/s/AKfycbyc3QGQMkCvcsdYuQMj9Dh9lM0TC9BjBX2qkivi2IWyTIsfmPbtKl74y_6Tc3AZPQKQ/exec';
const REFRESH_INTERVAL = 30000; // 30 segundos
const SCROLL_INTERVAL  = 3000;  // 3 segundos
const CARDS_TOTAL      = 30;

let tecnicos = [];
let tareas   = [];
let scrollTimers = {};
let refreshTimer = null;
let progressTimer = null;

// ── CLOCK ──
function updateClock() {
  const now  = new Date();
  const h    = String(now.getHours()).padStart(2,'0');
  const m    = String(now.getMinutes()).padStart(2,'0');
  const s    = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock-time').textContent = h + ':' + m + ':' + s;
  const dias = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const meses = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  document.getElementById('clock-date').textContent =
    dias[now.getDay()] + ' ' + now.getDate() + ' ' + meses[now.getMonth()] + ' ' + now.getFullYear();
}
setInterval(updateClock, 1000);
updateClock();

// ── REFRESH PROGRESS BAR ──
function startProgressBar() {
  const bar = document.getElementById('refresh-progress');
  const start = Date.now();
  bar.style.transition = 'none';
  bar.style.width = '0%';
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    const elapsed = Date.now() - start;
    const pct = Math.min(100, (elapsed / REFRESH_INTERVAL) * 100);
    bar.style.width = pct + '%';
    if (pct >= 100) clearInterval(progressTimer);
  }, 200);
}

// ── FETCH DATA ──
async function fetchData() {
  try {
    const [resTareas, resDatos] = await Promise.all([
      fetch(URL_PLAN + '?accion=getTareas', { redirect: 'follow' }).then(r => r.json()),
      fetch(URL_PLAN + '?accion=getDatos',  { redirect: 'follow' }).then(r => r.json())
    ]);
    if (resTareas.ok) tareas   = resTareas.data || [];
    if (resDatos.ok)  tecnicos = resDatos.data.tecnicos || [];
  } catch(e) {
    console.error('Error fetching data:', e);
  }
}

// ── DÍAS PENDIENTES ──
function diasPendientes(fechaRef) {
  if (!fechaRef) return null;
  try {
    const fecha = new Date(fechaRef);
    const hoy   = new Date();
    hoy.setHours(0,0,0,0);
    fecha.setHours(0,0,0,0);
    return Math.floor((hoy - fecha) / 86400000);
  } catch(e) { return null; }
}

function badgeDias(dias) {
  if (dias === null) return '';
  if (dias <= 3) return `<span class="badge badge-ok">${dias}D</span>`;
  if (dias <= 7) return `<span class="badge badge-warn">${dias}D</span>`;
  return `<span class="badge badge-crit">${dias}D</span>`;
}

function badgePrio(p) {
  const v = (p || '').toLowerCase();
  if (v === 'urgente') return '<span class="badge badge-urg">URG</span>';
  if (v === 'normal')  return '<span class="badge badge-norm">NRM</span>';
  return '<span class="badge badge-baja">BAJA</span>';
}

function prioOrder(p) {
  const v = (p || '').toLowerCase();
  if (v === 'urgente') return 0;
  if (v === 'normal')  return 1;
  return 2;
}

// ── RENDER ──
function render() {
  // Filtrar solo asignadas activas
  const activas = tareas.filter(t => {
    const est = (t.estado || '').toLowerCase();
    return est !== 'sin_asignar' && est !== 'finalizada';
  });

  // Calcular stats
  const totalAsig = activas.length;
  const totalUrg  = activas.filter(t => (t.prioridad||'').toLowerCase() === 'urgente').length;
  const totalCrit = activas.filter(t => {
    const d = diasPendientes(t.fechaRef);
    return d !== null && d > 7;
  }).length;

  document.getElementById('stat-total').textContent = totalAsig;
  document.getElementById('stat-urg').textContent   = totalUrg;
  document.getElementById('stat-crit').textContent  = totalCrit;

  // Limpiar timers de scroll existentes
  Object.values(scrollTimers).forEach(t => clearInterval(t));
  scrollTimers = {};

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Ordenar técnicos y tomar los primeros 30
  const tecnicosOrdenados = [...tecnicos].slice(0, CARDS_TOTAL);

  // Si hay menos de 30, rellenar con vacíos
  while (tecnicosOrdenados.length < CARDS_TOTAL) {
    tecnicosOrdenados.push(null);
  }

  tecnicosOrdenados.forEach((tec, idx) => {
    const card = document.createElement('div');
    card.className = 'card';

    if (!tec) {
      card.innerHTML = '<div class="card-header"><span class="card-nombre" style="color:var(--text3)">—</span></div><div class="card-body"><div class="empty-state">—</div></div>';
      grid.appendChild(card);
      return;
    }

    // Tareas de este mecánico
    const tareassTec = activas
      .filter(t => (t.mecanicos || []).includes(tec.legajo))
      .sort((a, b) => prioOrder(a.prioridad) - prioOrder(b.prioridad));

    const hasUrgent = tareassTec.some(t => (t.prioridad||'').toLowerCase() === 'urgente');
    if (hasUrgent) card.classList.add('has-urgent');

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';
    const apellido = tec.nombre.split(' ').pop();
    header.innerHTML = `
      <span class="card-nombre">${apellido}</span>
      <span class="card-legajo">${tec.legajo}</span>
      <span class="card-count">${tareassTec.length > 0 ? tareassTec.length + ' tarea' + (tareassTec.length !== 1 ? 's' : '') : ''}</span>
    `;
    card.appendChild(header);

    // Body
    const body = document.createElement('div');
    body.className = 'card-body';

    if (!tareassTec.length) {
      body.innerHTML = '<div class="empty-state">— sin tareas —</div>';
    } else {
      const scroll = document.createElement('div');
      scroll.className = 'card-scroll';
      scroll.id = 'scroll-' + idx;

      tareassTec.forEach(t => {
        const pClass = (t.prioridad||'').toLowerCase() === 'urgente' ? 'prio-urg' :
                       (t.prioridad||'').toLowerCase() === 'normal'  ? 'prio-norm' : 'prio-baja';

        // Extraer descripción y sector del código
        const codigo = t.codigo || '';
        const sepCM  = codigo.indexOf('_CM');
        const sepRI  = codigo.lastIndexOf('_RI');
        const sep    = sepCM > 0 ? sepCM : sepRI > 0 ? sepRI : -1;
        let partesCod = sep > 0 ? codigo.substring(0, sep).split('_') : codigo.split('_');
        const sector  = partesCod.slice(-1)[0] || '';
        const desc    = partesCod.slice(0, -1).join(' ') || sector;

        const dias = diasPendientes(t.fechaRef);

        const taskEl = document.createElement('div');
        taskEl.className = 'task ' + pClass;
        taskEl.innerHTML = `
          <div class="task-info">
            <div class="task-desc">${desc}</div>
            <div class="task-sector">${sector}</div>
          </div>
          <div class="badges">
            ${badgePrio(t.prioridad)}
            ${badgeDias(dias)}
          </div>
        `;
        scroll.appendChild(taskEl);
      });

      body.appendChild(scroll);

      // Auto-scroll si hay muchas tareas
      if (tareassTec.length > 2) {
        let scrollDir = 1;
        scrollTimers[idx] = setInterval(() => {
          const el = document.getElementById('scroll-' + idx);
          if (!el) return;
          const parent = el.parentElement;
          const maxScroll = el.scrollHeight - parent.clientHeight;
          if (maxScroll <= 0) return;
          if (scrollDir === 1) {
            parent.scrollTop += parent.clientHeight * 0.6;
            if (parent.scrollTop >= maxScroll - 5) scrollDir = -1;
          } else {
            parent.scrollTop = 0;
            scrollDir = 1;
          }
        }, SCROLL_INTERVAL);
      }
    }

    card.appendChild(body);
    grid.appendChild(card);
  });

  document.getElementById('loading').style.display = 'none';
}

// ── MAIN LOOP ──
async function refresh() {
  await fetchData();
  render();
  startProgressBar();
}

async function init() {
  await refresh();
  refreshTimer = setInterval(refresh, REFRESH_INTERVAL);
}

init();
</script>
</body>
</html>
