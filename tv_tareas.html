<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimiento Frigomerc — Pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #080b10;
  --bg2:       #0d1117;
  --bg3:       #131920;
  --border:    #1e2a38;
  --border2:   #243040;
  --text:      #d4dde8;
  --text2:     #6b7d8f;
  --text3:     #3a4a5a;
  --accent:    #1a7fff;
  --urg:       #e04040;
  --norm:      #d4920a;
  --baja:      #1e8a4a;
  --dias-ok:   #1e8a4a;
  --dias-warn: #c47a0a;
  --dias-crit: #c83030;
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'IBM Plex Sans', sans-serif;
}
html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.06) 3px, rgba(0,0,0,.06) 4px);
  pointer-events: none;
  z-index: 999;
}

/* HEADER */
.header {
  height: 36px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
}
.header-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.header-logo-dot { font-family: var(--mono); font-size: 10px; color: var(--accent); }
.header-logo-txt { font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text); white-space: nowrap; }
.header-logo-sub { font-family: var(--mono); font-size: 9px; color: #4a5a6a; letter-spacing: .06em; text-transform: uppercase; margin-left: 2px; }
.header-divider { width: 1px; height: 20px; background: var(--border2); margin: 0 18px; flex-shrink: 0; }
.header-stats { display: flex; gap: 18px; align-items: center; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat-val { font-family: var(--mono); font-size: 18px; font-weight: 700; line-height: 1; }
.stat-label { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; text-transform: uppercase; color: var(--text2); white-space: nowrap; }
.stat-sep { width: 1px; height: 16px; background: var(--border2); }
.header-spacer { flex: 1; }
.header-clock { text-align: right; flex-shrink: 0; }
.clock-time { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: .04em; }
.clock-date { font-family: var(--mono); font-size: 7px; color: var(--text2); letter-spacing: .1em; text-transform: uppercase; }

/* REFRESH BAR */
.refresh-bar { height: 2px; background: var(--border); flex-shrink: 0; position: relative; overflow: hidden; }
.refresh-progress { height: 100%; background: var(--accent); width: 0%; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(6, 1fr);
  gap: 5px;
  padding: 5px;
  height: calc(100vh - 36px - 2px);
}

/* CARD */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; display: flex; flex-direction: column; overflow: hidden; }
.card.has-urgent { animation: pulse-border 2s ease infinite; }
@keyframes pulse-border { 0%,100%{border-color:rgba(224,64,64,.4)} 50%{border-color:rgba(224,64,64,.8)} }

.card-header {
  padding: 2px 7px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  height: 17px;
}
.card-nombre { font-family: var(--mono); font-size: 7px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta { display: flex; gap: 4px; align-items: center; flex-shrink: 0; margin-left: 5px; }
.card-legajo { font-family: var(--mono); font-size: 6px; color: var(--text3); }
.card-count { font-family: var(--mono); font-size: 6px; color: var(--text2); }

.card-body { flex: 1; overflow: hidden; position: relative; }
.card-scroll { padding: 1px 7px 2px; display: flex; flex-direction: column; will-change: transform; }

.empty-state { height: 100%; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 7px; color: var(--text3); letter-spacing: .08em; }

/* TASK LIST */
.task-list { list-style: none; display: flex; flex-direction: column; }
.task-item {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0;
  border-bottom: 1px solid #0f1820;
  height: 18px;
  flex-shrink: 0;
}
.task-item:last-child { border-bottom: none; }
.task-item.prio-urg { border-left: 2px solid var(--urg); padding-left: 4px; }
.task-item.prio-norm { border-left: 2px solid var(--norm); padding-left: 4px; }
.task-item.prio-baja { border-left: 2px solid var(--baja); padding-left: 4px; }

.task-desc { flex: 1; overflow: hidden; white-space: nowrap; min-width: 0; }
.task-desc-inner { display: inline-block; white-space: nowrap; font-size: 7px; font-weight: 500; color: #c8d4e0; font-family: var(--sans); will-change: transform; }
.task-sector { font-size: 6px; color: #4a5a6a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 30%; flex-shrink: 0; font-family: var(--sans); }
.task-right { display: flex; gap: 3px; align-items: center; flex-shrink: 0; width: 24px; }
.task-prio { font-family: var(--mono); font-size: 7px; font-weight: 700; }
.prio-u { color: var(--urg); }
.prio-n { color: var(--norm); }
.prio-b { color: var(--baja); }
.task-dias { font-family: var(--mono); font-size: 6px; font-weight: 700; }
.dias-ok   { color: var(--dias-ok); }
.dias-warn { color: var(--dias-warn); }
.dias-crit { color: var(--dias-crit); }

/* LOADING */
#loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 100; font-family: var(--mono); font-size: 13px; color: var(--text2); letter-spacing: .1em; }
.spinner-tv { width: 32px; height: 32px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading"><div class="spinner-tv"></div>CARGANDO DATOS...</div>

<div class="header">
  <div class="header-logo">
    <span class="header-logo-dot">●</span>
    <span class="header-logo-txt">Frigomerc</span>
    <span class="header-logo-sub">— Pendientes</span>
  </div>
  <div class="header-divider"></div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-val" id="stat-asig" style="color:var(--accent)">—</div>
      <div class="stat-label">Asignados</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <div class="stat-val" id="stat-sinasig" style="color:var(--norm)">—</div>
      <div class="stat-label">Sin asignar</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <div class="stat-val" id="stat-total" style="color:var(--text)">—</div>
      <div class="stat-label">Total pendientes</div>
    </div>
  </div>
  <div class="header-spacer"></div>
  <div class="header-clock">
    <div class="clock-time" id="clock-time">--:--:--</div>
    <div class="clock-date" id="clock-date">---</div>
  </div>
</div>

<div class="refresh-bar"><div class="refresh-progress" id="refresh-progress"></div></div>
<div class="grid" id="grid"></div>

<script>
const URL_PLAN = 'https://script.google.com/macros/s/AKfycbyc3QGQMkCvcsdYuQMj9Dh9lM0TC9BjBX2qkivi2IWyTIsfmPbtKl74y_6Tc3AZPQKQ/exec';
const REFRESH_INTERVAL = 30000;
const ITEM_H   = 18;
const V_SPEED  = 0.08;
const H_SPEED  = 0.3;
const CARDS_TOTAL = 30;

let tecnicos = [];
let tareas   = [];
let ncs      = [];
let scrollTimers = {};
let progressTimer = null;

// CLOCK
function updateClock() {
  const now = new Date();
  const pad = x => String(x).padStart(2,'0');
  document.getElementById('clock-time').textContent = pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
  const dias  = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
  const meses = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
  document.getElementById('clock-date').textContent = dias[now.getDay()]+' '+now.getDate()+' '+meses[now.getMonth()]+' '+now.getFullYear();
}
setInterval(updateClock, 1000);
updateClock();

// PROGRESS BAR
function startProgressBar() {
  const bar = document.getElementById('refresh-progress');
  const start = Date.now();
  bar.style.width = '0%';
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    const pct = Math.min(100, ((Date.now() - start) / REFRESH_INTERVAL) * 100);
    bar.style.width = pct + '%';
    if (pct >= 100) clearInterval(progressTimer);
  }, 200);
}

// FETCH
async function fetchData() {
  try {
    const [resTareas, resDatos, resNCs] = await Promise.all([
      fetch(URL_PLAN + '?accion=getTareas', { redirect: 'follow' }).then(r => r.json()),
      fetch(URL_PLAN + '?accion=getDatos',  { redirect: 'follow' }).then(r => r.json()),
      fetch(URL_PLAN + '?accion=getNCs',    { redirect: 'follow' }).then(r => r.json()),
    ]);
    if (resTareas.ok) tareas   = resTareas.data || [];
    if (resDatos.ok)  tecnicos = resDatos.data.tecnicos || [];
    if (resNCs.ok)    ncs      = resNCs.data || [];
  } catch(e) { console.error(e); }
}

// DIAS
function diasPendientes(fechaRef) {
  if (!fechaRef) return null;
  try {
    const f = new Date(fechaRef); f.setHours(0,0,0,0);
    const h = new Date(); h.setHours(0,0,0,0);
    return Math.floor((h - f) / 86400000);
  } catch(e) { return null; }
}

// RENDER
function render() {
  const activas   = tareas.filter(t => { const e=(t.estado||'').toLowerCase(); return e!=='sin_asignar'&&e!=='finalizada'; });
  const sinAsignar= ncs.length;
  const total     = activas.length + sinAsignar;

  document.getElementById('stat-asig').textContent    = activas.length;
  document.getElementById('stat-sinasig').textContent = sinAsignar;
  document.getElementById('stat-total').textContent   = total;

  Object.values(scrollTimers).forEach(t => clearInterval(t));
  scrollTimers = {};

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const tecsList = [...tecnicos].slice(0, CARDS_TOTAL);
  while (tecsList.length < CARDS_TOTAL) tecsList.push(null);

  tecsList.forEach((tec, idx) => {
    const card = document.createElement('div');
    card.className = 'card';

    if (!tec) {
      card.innerHTML = '<div class="card-header"><span class="card-nombre" style="color:var(--text3)">—</span></div><div class="card-body"><div class="empty-state">—</div></div>';
      grid.appendChild(card);
      return;
    }

    const tareassTec = activas
      .filter(t => (t.mecanicos||[]).includes(tec.legajo))
      .sort((a,b) => {
        const o = p => p==='Urgente'?0:p==='Normal'?1:2;
        return o(a.prioridad) - o(b.prioridad);
      });

    if (tareassTec.some(t => (t.prioridad||'').toLowerCase()==='urgente')) card.classList.add('has-urgent');

    const partes = tec.nombre.split(' ');
    const nombre = (partes[0]||'').substring(0,1) + '. ' + (partes[1]||'');

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML = `<span class="card-nombre">${nombre}</span><div class="card-meta"><span class="card-legajo">${tec.legajo}</span>${tareassTec.length?`<span class="card-count">${tareassTec.length}t</span>`:''}</div>`;
    card.appendChild(header);

    const body = document.createElement('div');
    body.className = 'card-body';

    if (!tareassTec.length) {
      body.innerHTML = '<div class="empty-state">— sin tareas —</div>';
    } else {
      const scroll = document.createElement('div');
      scroll.className = 'card-scroll';
      const ul = document.createElement('ul');
      ul.className = 'task-list';

      const allItems = tareassTec.length > 3 ? [...tareassTec, ...tareassTec] : tareassTec;

      allItems.forEach(t => {
        const prio  = (t.prioridad||'').toLowerCase();
        const pClass = prio==='urgente'?'prio-urg':prio==='normal'?'prio-norm':'prio-baja';
        const pLett  = prio==='urgente'?'U':prio==='normal'?'N':'B';
        const pC     = prio==='urgente'?'prio-u':prio==='normal'?'prio-n':'prio-b';
        const dias   = diasPendientes(t.fechaRef);
        const dClass = dias===null?'':dias<=3?'dias-ok':dias<=7?'dias-warn':'dias-crit';
        const diasTxt= dias!==null?`<span class="task-dias ${dClass}">${dias}d</span>`:'';

        const codigo = t.codigo||'';
        const sepCM  = codigo.indexOf('_CM');
        const sepRI  = codigo.lastIndexOf('_RI');
        const sep    = sepCM>0?sepCM:sepRI>0?sepRI:-1;
        const partesCod = sep>0?codigo.substring(0,sep).split('_'):codigo.split('_');
        const sector = partesCod.slice(-1)[0]||'';
        const desc   = partesCod.slice(0,-1).join(' ')||sector;

        const li = document.createElement('li');
        li.className = 'task-item ' + pClass;
        li.innerHTML = `<div class="task-desc"><span class="task-desc-inner">${desc}</span></div><span class="task-sector">${sector}</span><div class="task-right"><span class="task-prio ${pC}">${pLett}</span>${diasTxt}</div>`;
        ul.appendChild(li);
      });

      scroll.appendChild(ul);
      body.appendChild(scroll);

      // Scroll vertical circular
      if (tareassTec.length > 3) {
        const loopH = tareassTec.length * ITEM_H;
        let pos = 0;
        scrollTimers[idx] = setInterval(() => {
          pos += V_SPEED;
          if (pos >= loopH) pos -= loopH;
          scroll.style.transform = `translateY(${-pos}px)`;
        }, 16);
      }
    }

    card.appendChild(body);
    grid.appendChild(card);
  });

  document.getElementById('loading').style.display = 'none';

  // Scroll horizontal circular para descripciones largas
  setTimeout(() => {
    document.querySelectorAll('.task-desc').forEach(container => {
      const inner = container.querySelector('.task-desc-inner');
      if (!inner) return;
      requestAnimationFrame(() => {
        const cW = container.clientWidth;
        const tW = inner.scrollWidth;
        if (tW > cW + 4) {
          const originalText = inner.textContent;
          inner.textContent = originalText + '      ' + originalText;
          const loopW = tW + 20;
          let pos = 0;
          setInterval(() => {
            pos += H_SPEED;
            if (pos >= loopW) pos -= loopW;
            inner.style.transform = `translateX(${-pos}px)`;
          }, 16);
        }
      });
    });
  }, 500);
}

// MAIN
async function refresh() {
  await fetchData();
  render();
  startProgressBar();
}

refresh();
setInterval(refresh, REFRESH_INTERVAL);
</script>
</body>
</html>
